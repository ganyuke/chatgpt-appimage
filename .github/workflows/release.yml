name: release

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install host build dependencies
        run: >-
          dnf install -y
          bsdtar
          curl
          desktop-file-utils
          file
          git
          gh
          ShellCheck
          squashfs-tools
          zsync

      - uses: actions/checkout@v7

      - name: Build x86_64
        run: ./build.sh x86_64

      - name: Determine version
        id: version
        run: |
          set -eu
          out=$(find dist -name 'ChatGPT-*-x86_64.AppImage')
          ver=${out#dist/ChatGPT-}
          ver=${ver%-x86_64.AppImage}
          printf 'version=%s\n' "$ver" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Build aarch64
        if: steps.existing.outputs.exists == 'false'
        run: ./build.sh aarch64

      - name: Log AppImage SHA256 checksums
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -eu
          sha256sum dist/ChatGPT-*.AppImage

      - name: Generate SHA256SUMS
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -eu
          cd dist
          sha256sum ChatGPT-* > SHA256SUMS

      - name: Attest release assets
        if: steps.existing.outputs.exists == 'false'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/ChatGPT-*
            dist/SHA256SUMS

      - name: Verify attestations
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          signer="${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          for asset in dist/ChatGPT-* dist/SHA256SUMS; do
            gh attestation verify "$asset" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "$signer" \
              --deny-self-hosted-runners
          done

      - name: Create release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v='${{ steps.version.outputs.version }}'
          tag="v$v"
          notes="Unofficial AppImage repack of the ChatGPT desktop deb (upstream version $v). Not affiliated with or endorsed by OpenAI."
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "ChatGPT $v" \
            --notes "$notes"
          gh release upload "$tag" \
            "dist/ChatGPT-$v-x86_64.AppImage" \
            "dist/ChatGPT-$v-x86_64.AppImage.zsync" \
            "dist/ChatGPT-$v-aarch64.AppImage" \
            "dist/ChatGPT-$v-aarch64.AppImage.zsync" \
            dist/SHA256SUMS
          gh release edit "$tag" --draft=false
