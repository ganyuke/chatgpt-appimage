name: release

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora-minimal:latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Install dependencies
        run: |
          dnf5 install -y --nodocs --setopt=install_weak_deps=False --setopt=max_parallel_downloads=10 --setopt=deltarpm=0 -y bsdtar curl desktop-file-utils file git squashfs-tools zsync

      - uses: actions/checkout@v7

      - name: Build artifact
        env:
          SKIP_SHELLCHECK: 1
        run: ./build.sh ${{ matrix.arch }}

      - name: Determine version
        id: version
        run: |
          set -eu
          out=$(find dist -name 'ChatGPT-*-${{ matrix.arch }}.AppImage')
          ver=${out#dist/ChatGPT-}
          ver=${ver%-${{ matrix.arch }}.AppImage}
          printf 'version=%s\n' "$ver" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          set -eu
          out=$(find dist -name 'ChatGPT-*-x86_64.AppImage')
          ver=${out#dist/ChatGPT-}
          ver=${ver%-x86_64.AppImage}
          printf 'version=%s\n' "$ver" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Log SHA256 checksums
        run: sha256sum dist/ChatGPT-*.AppImage

      - name: Generate SHA256SUMS
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -eu
          cd dist
          sha256sum ChatGPT-* > SHA256SUMS

      - name: Attest release assets
        if: steps.existing.outputs.exists == 'false'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/ChatGPT-*
            dist/SHA256SUMS

      - name: Verify attestations
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          signer="${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          for asset in dist/ChatGPT-* dist/SHA256SUMS; do
            gh attestation verify "$asset" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "$signer" \
              --deny-self-hosted-runners
          done

      - name: Create release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v='${{ steps.version.outputs.version }}'
          tag="v$v"
          notes="Unofficial AppImage repack of the ChatGPT desktop deb (upstream version $v). Not affiliated with or endorsed by OpenAI."
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "ChatGPT $v" \
            --notes "$notes"
          gh release upload "$tag" dist/*
          gh release edit "$tag" --draft=false