name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install checkout and lint dependencies
        run: dnf install -y git ShellCheck

      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck AppRun build.sh scripts/check-host-deps.sh scripts/prepare-tools.sh scripts/build-appimage.sh

      - name: POSIX shell syntax
        run: |
          sh -n AppRun
          sh -n build.sh
          sh -n scripts/check-host-deps.sh
          sh -n scripts/prepare-tools.sh
          sh -n scripts/build-appimage.sh
